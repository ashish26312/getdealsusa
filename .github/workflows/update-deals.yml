name: Update deals
on:
  # Automatic schedule is off for now. Each Netlify deploy uses 15 of the 300 free
  # monthly credits, so a daily run (about 30 deploys) would go over the free plan.
  # To turn it on, uncomment the two lines below (this example runs once a day).
  # schedule:
  #   - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-deals
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build deals.json
        run: |
          node scripts/build-deals.mjs
          node scripts/build-seo.mjs
        env:
          # One secret per feed URL (feed URLs usually contain an access token).
          # Reference it in data/feeds.config.json as ${EXAMPLE_FEED_URL}.
          EXAMPLE_FEED_URL: ${{ secrets.EXAMPLE_FEED_URL }}
      - name: Commit changes
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add -A public data/history.json
          git diff --cached --quiet || (git commit -m "Update deals" && git push)
